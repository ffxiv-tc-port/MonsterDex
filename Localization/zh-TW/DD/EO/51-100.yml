#EO boss floor 80
12247: |
  「共鳴」－大範圍扇形死刑技。
  「右／左側神經毒氣」－對角線半場範圍斬擊，王的正面永遠安全。
  「集中神經毒氣」－大範圍正面扇形範圍斬擊。
  「神經毒氣環」－只剩近戰距離安全的大範圍甜甜圈AoE。
  「氣壓力場」－在王身下與外環之外製造附帶持續傷害的秒殺區域。
  「自動火砲」－四個方位上的無人機會對場地施放直線AoE。
  「奈米孢子噴射」－讓玩家帶有正或負電荷，之後會連結到某個方位的無人機。之後的施放會產生新的「氣壓力場」。
  奈米孢子循環順序：神經毒氣1、神經毒氣2（配合自動火砲）、神經毒氣3（配合自動火砲）、出現連結線、神經毒氣4（配合自動火砲）、神經毒氣環（配合自動火砲）
  連結線會在「神經毒氣環」詠唱結束前不久解除，解除後到「神經毒氣環」／自動火砲發動前會有片刻時間可以調整站位
