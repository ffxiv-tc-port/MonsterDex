HoH1: |
  「天之飛鯊」和「天之切網蝦蛄」能直接把你的頭扯掉，要多加小心！
  這裡也有一些要注意的牆壁陷阱。
  1~6層沒有青銅寶箱，因此也不會出現模仿怪。
  這幾層也不會掉落魔石，或是「魔陶器：改變敵人」、「魔陶器：解咒」、「魔陶器：魔法效果解除」、「魔陶器：石化敵人」、「魔陶器：隱形」、「魔陶器：復生」。
  這些從第7層開始都能找到，唯獨上位魔石要到第31層才會出現。
  第9層不會掉落「魔陶器：寶箱增加」、「魔陶器：減少敵人」、「魔陶器：改變敵人」。
HoH11: |
  小心「天之右手」的暴走。
  這裡也有一些牆壁陷阱。
  第15層必定是迷惑階層。
  這個層數區間找不到上位魔石。
  第19層不會掉落「魔陶器：寶箱增加」、「魔陶器：減少敵人」、「魔陶器：改變敵人」。
HoH21: |
  大家刷經驗值最愛重複刷的層數區間。
  這個層數區間找不到上位魔石。
  第29層不會掉落「魔陶器：寶箱增加」、「魔陶器：減少敵人」、「魔陶器：改變敵人」。
HoH31: |
  小心「天之切腹般若」和「天之隱秘」的暴走。
  有兩隻不同的敵人都叫做「天之隱秘」－一隻是巡邏怪，另一隻不是。
  從這個層數區間開始有機會找到上位魔石。
  第39層不會掉落「魔陶器：寶箱增加」、「魔陶器：減少敵人」、「魔陶器：改變敵人」。
  從這個層數區間開始有機會找到黃金袋。
HoH41: |
  小心「天之石板」和「天之仙女蟲」的暴走，這幾層也要注意牆壁陷阱。
  關於這些敵人有些奇怪的地方……
    有兩隻不同的敵人都叫做「天之石像」－一隻是巡邏怪，另一隻不是。
      兩隻都是魔像，但外觀不同。
    有兩隻不同的敵人都叫做「天之異石」。
      牠們都屬於馬婁里石（Marolith）一族，但一隻是綠色，另一隻是紫色。
    有兩隻不同的敵人都叫做「天之骰子」。
      兩隻外觀相同，差別在於一隻會詠唱「風刃」，另一隻會詠唱「龍捲風」，且出現的樓層不同。
  第49層不會掉落「魔陶器：寶箱增加」、「魔陶器：減少敵人」、「魔陶器：改變敵人」。
HoH51: |
  小心「天之金剛鈴」和「天之鐵爪」的暴走、「天之那迦」的「不祥怒吼」，以及「天之無厘頭」在戰鬥外施放的AoE。
  這幾層也要注意牆壁陷阱。
HoH61: |
  從這個層數區間開始，模仿怪會出現在黃金寶箱中，且無法被暈眩。
  「天之怨靈」是這裡最難纏的敵人，但牠是靠近感知仇恨，沒辦法每次都閃避。
  這幾層也要注意牆壁陷阱。
HoH71: |
  從這個層數區間開始有機會找到白金袋。
  建議在這個層數區間一開始就使用「魔陶器：復生」和「魔陶器：感知寶藏」。
  但要小心衝進房間中央撿埋藏寶藏，因為這裡的陷阱常常致命。
  如果已經使用過「魔陶器：咒印解除」、「魔陶器：全景」或「魔陶器：隱形」會比較安全；
    又或者你打算使用「魔陶器：石化敵人」或魔石。
  這是最後一個能找到「魔陶器：復生」的層數區間，不過掉落機率會提高。
  小心「wraith」型和「elbst」型敵人在戰鬥外施放的AoE，一不注意就會被秒殺。
  使用隱形時，「天之長毛象」也可能造成麻煩。
  這幾層有很多大範圍AoE－請務必熟悉並知道如何迴避或阻止它們。
  已知71~73層有大量地雷。
  坦克在這幾層特別適合使用「魔陶器：全景」來善用這一點。
  這幾層也要注意牆壁陷阱。
HoH81: |
  別忘了在這個層數區間一開始使用「魔陶器：復生」，可惜這裡已經找不到更多了。
  如果要去挖埋藏寶藏請務必小心！
  84~86層最為棘手，主要是因為沒人想面對的「天之真濟」巡邏怪。
  這幾層通常很適合使用「魔陶器：減少敵人」／「魔陶器：改變敵人」／「魔陶器：石化敵人」／魔石。
  已知87~89層有大量地雷。
  坦克在這幾層特別適合使用「魔陶器：全景」來善用這一點。
HoH91: |
  別忘了在這個層數區間一開始使用「魔陶器：復生」，可惜這裡已經找不到更多了。
  如果要去挖埋藏寶藏請務必小心！
  91~93層，單人挑戰時最好對付的是白魔導士型敵人。
    如果能用地形阻隔視線來迴避牠們詠唱的「石擊」，就能完全不受傷。
    可以先在第11層以後的小精靈身上練習用地形阻隔視線，畢竟這個技巧並不容易。
    建議盡量避開戰士型敵人。
  94~96層是這個區間中最棘手的，很適合使用「魔陶器：減少敵人」／「魔陶器：改變敵人」／「魔陶器：石化敵人」／魔石。
  97~99層其實敵人最好對付。
  第99層必定會有3次附魔機會，請盡量留一個「魔陶器：魔法效果解除」給它用。
