# Floor 30 Boss
13863: |
  1) 「光之連禱」－會在4個可能位置落下環形AoE
  2) 「救贖之握」－先對發光手臂那一側施放半場範圍斬擊，接著施放另一半外加正面額外45度的範圍斬擊
  3) 「神之寵愛」－8個會追逐玩家的誘導型AoE
