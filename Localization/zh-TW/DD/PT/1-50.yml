# Floor 50 Boss
14263: |
  1) 「地面液化」－將場地變為流沙，僅有少數安全點。停留在流沙中4秒會死亡。
  2) 「進沙坑」－王會進入無法鎖定狀態，並施放4個追逐型誘導大範圍AoE。
  3) 「捲風者」－在場地中央放置龍捲風，發動時若不在流沙中會被擊退。
