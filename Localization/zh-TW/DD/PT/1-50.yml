# Floor 40 Boss
13977: |
  1) 「祝福綻放」－黃色（閃光）為巨大AoE，藍色（水）為擊退。王一定會先發動，接著依小怪跳躍順序施放。
  2) 「近潮」－巨大自身周圍AoE
  3) 「遠潮」－甜甜圈AoE，需站在王正下方
  4) 小怪「被寬恕的諂媚者」最終會施放暴走技「自我了斷」
13978: |
  「自爆」－暴走施放
