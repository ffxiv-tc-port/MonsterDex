# Floor 10 Boss
13979: |
  1) 「樹籬謎陣」－粉紅色殘影最終落點會出現三個大範圍AoE，並召喚三隻小怪。
  2) 「碎葉」－王的預警處會出現四個大範圍AoE。每次跳躍時，存活的小怪都會造成暈眩並施放巨額傷害。
13980: |
  王在「碎葉」跳躍時會造成大量傷害。
# Floor 20 Boss
13973: |
  1) 「空降」－擊退後，發光的腳會指示出四個AoE。
  2) 「植根」－誘導型擴散星形AoE，請誘導到牆邊。
