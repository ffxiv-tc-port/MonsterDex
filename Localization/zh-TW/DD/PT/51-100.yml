  4) 「潛行死神」－附加以下兩種異常狀態其中之一，發動時請靠近王的身邊或身下。
    a) 「死亡之影」－即死宣告，須在下一次「巢穴／環」組合中被觸鬚雷擊命中才能解除。
    b) 「無處可逃」－中招的玩家每次移動都會疊加，疊滿8層會死亡。請盡量減少移動來迴避「巢穴／環」組合。
