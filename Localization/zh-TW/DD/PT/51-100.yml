# Floor 99 Boss
14037: |
  場地上有光與暗的區塊，會附加「光之復仇」或「暗之復仇」。
    a) 「光之復仇」－可對「顯著的悲傷」（暗屬性）造成傷害
    b) 「暗之復仇」－可對「吞噬者」（光屬性）造成傷害

  「顯著的悲傷」與「吞噬者」會同時施放以下機制。請注意時機不一定同步，務必留意詠唱條。
  1) 「初光之刃」－「吞噬者」會依她持劍的方式，施放中線或兩側的範圍斬擊。
  2) 「火球」－「顯著的悲傷」會持有四顆或兩顆火球。
    a) 四顆火球－詠唱結束時，AoE會誘導到玩家腳下。
    b) 兩顆火球（連結線）－詠唱結束時，全體玩家會附加「熱病」。請勿攻擊或移動。
  3) 「罪之束縛」－玩家會被連結線拉到場地中央，中央周圍會出現多個圓形AoE。請從最後出現的圓形AoE中迴避出去。
  4) 「棘鞭」－誘導型直線AoE，命中窗戶會召喚小怪。請誘導到窗戶之間，就不會召喚小怪。目標標記消失後再迴避。
  5) 「乙太吸取」－「顯著的悲傷」與「吞噬者」會在不同時機施放此技能。需持有對應的相反狀態才能存活（面對「吞噬者」要有暗之復仇，面對「顯著的悲傷」要有光之復仇）
  6) 「深淵烈焰」－依垂直或水平方向開啟兩個傳送門，並召喚兩次水晶。水晶發光後會依方向施放直線連續爆炸。其中一個角落是安全的。
