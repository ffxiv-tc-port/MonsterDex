PotD1: |
  1~6層每個房間都固定有2隻敵人，且沒有模仿怪。
  已知有1個牆壁陷阱。
  這個層數區間只會出現「生命值＆魔力值提升」、「生命值懲罰」、「急速」、「失明」這幾種附魔。
  2~4層絕對不會有附魔
  第5層必定恰好有1個附魔
  6~9層最多只有1個附魔。
  單人挑戰的話，這個層數區間建議全部刷完賺經驗值。小心「地宮黃蜂」的「終結刺針」。
  這個層數區間完全不會掉落「魔陶器：魔法效果解除」、「魔陶器：改變敵人」、「魔陶器：怒火」、「魔陶器：解咒」、「魔陶器：覺悟」、「魔陶器：復生」。
  第9層不會掉落「魔陶器：寶箱增加」和「魔陶器：減少敵人」。
PotD11: |
  小心「地宮史萊姆」的暴走，若觸發青蛙化陷阱請遠離蛇型敵人！
  已知有1個牆壁陷阱。
  這個層數區間不會出現「擊退懲罰」附魔。每層最多可有2個附魔。
  單人挑戰的話，這個層數區間建議全部刷完賺經驗值。
  這個層數區間完全不會掉落「魔陶器：怒火」、「魔陶器：覺悟」、「魔陶器：復生」。
  第19層不會掉落「魔陶器：寶箱增加」、「魔陶器：減少敵人」、「魔陶器：改變敵人」。
PotD21: |
  小心「地宮米諾陶洛斯」巡邏怪的無預警AoE。
  這裡也有已知的牆壁陷阱。
  從這個層數區間開始，所有附魔都可能出現，每層最多可有3個附魔。
  這個層數區間完全不會掉落「魔陶器：覺悟」和「魔陶器：復生」。
  第29層不會掉落「魔陶器：寶箱增加」、「魔陶器：減少敵人」、「魔陶器：改變敵人」。
PotD31: |
  這裡沒什麼特別的。有一個已知的牆壁陷阱，可以避開。
  這個層數區間完全不會掉落「魔陶器：覺悟」和「魔陶器：復生」。
  第39層不會掉落「魔陶器：寶箱增加」、「魔陶器：減少敵人」、「魔陶器：改變敵人」。
PotD41: |
  從這個層數區間開始，模仿怪會免疫暈眩，並出現在黃金寶箱中。
  有一個已知的牆壁陷阱，可以避開。
  這個層數區間完全不會掉落「魔陶器：改變敵人」、「魔陶器：覺悟」、「魔陶器：復生」。
  第49層不會掉落「魔陶器：寶箱增加」和「魔陶器：減少敵人」。
  通過這個層數區間後，就能解鎖從第51層開始建立新檔案的選項。
PotD51: |
  大家刷經驗值最愛重複刷的層數區間。
  小心牆壁陷阱。
  這個層數區間完全不會掉落「魔陶器：覺悟」。
  第59層不會掉落「魔陶器：寶箱增加」、「魔陶器：減少敵人」、「魔陶器：改變敵人」。
PotD61: |
  小心牆壁陷阱。
  第69層不會掉落「魔陶器：寶箱增加」、「魔陶器：減少敵人」、「魔陶器：改變敵人」。
PotD71: |
  小心牆壁陷阱。
  第79層不會掉落「魔陶器：寶箱增加」、「魔陶器：減少敵人」、「魔陶器：改變敵人」。
PotD81: |
  小心炸彈型與蟲型敵人的暴走。
  這裡也有一個已知的牆壁陷阱，可以避開。
  第89層不會掉落「魔陶器：寶箱增加」、「魔陶器：減少敵人」、「魔陶器：改變敵人」。
PotD91: |
  這裡有很多靠近感知仇恨的敵人，以及很多不死系敵人。
  除了「地宮蠅群」、「地宮小紅花」、「駿鷹」以外，其他敵人都能用「魔陶器：覺悟」快速擊殺。
  記得留一個以上給王使用。
  小心牆壁陷阱。
  第99層不會掉落「魔陶器：寶箱增加」、「魔陶器：減少敵人」、「魔陶器：改變敵人」。
  這是劇情樓層的最後一段。
PotD101: |
  小心「深宮黃蜂」的「終結刺針」。
  這裡也有一個可以避開的牆壁陷阱。
PotD111: |
  需要注意的事項：
  －「深宮史萊姆」的暴走
  －觸發青蛙化陷阱後出現的蛇型敵人
  －「深宮南加」在戰鬥外的隨機AoE
  這裡也有很多牆壁陷阱。
PotD121: |
  小心「深宮米諾陶洛斯」的無預警自身周圍AoE。
  這裡也有很多牆壁陷阱。
PotD131: |
  小心「深宮惡精靈」的無預警石化。
  牆壁陷阱也更多。
PotD141: |
  這裡開始變得更棘手，有幾隻敵人的傷害很重。
  小心魅魔型敵人在戰鬥外的隨機AoE。
  惡魔型敵人也有暴走。
  牆壁陷阱也更多。
PotD151: |
  有個好消息：
  不會再有突襲的巡邏怪了！
  牆壁非常少，之後的視野都很好。
  現在開始會掉落黃金袋。
  建議盡快使用「魔陶器：感知寶藏」，但走進房間去撿寶藏時要小心
    誘導型陷阱會越來越可怕！
  有些人偏好不冒險去挖埋藏寶藏，
    但如果已經使用過「魔陶器：咒印解除」或「魔陶器：全景」，或是房間裡的陷阱已經被觸發過，會比較安全
  這裡要小心的敵人是「小頑童」和「深宮奪魂魔」。
  這幾層要注意牆壁陷阱。
PotD161: |
  這裡有幾隻傷害很重的恐龍型敵人，但整體比前一個層數區間簡單。
  這幾層要注意牆壁陷阱。
PotD171: |
  歡迎來到貝西摩斯的領域！
  前半段有很多好對付的敵人，但最後幾層會比較艱難。
  盡量節省魔陶器的使用，
    但如果時間不夠，不要害怕直接用掉一個「魔陶器：減少敵人」，
    或是遇到一層有很多「深宮安祖」與「深宮大腳巨猿」、討厭的異常狀態等情況時，直接用「魔陶器：怒火」。
  如果你有3個「魔陶器：復生」，或是不太有信心能全清這個層數區間，請立刻使用。
  這也是最後能掉落它的層數區間。
  這幾層要注意牆壁陷阱。
PotD181: |
  別忘了在這個層數區間一開始使用「魔陶器：復生」，可惜這裡已經找不到更多了。
  就一般樓層而言，這是最恐怖的層數區間。
  187~189層有非常棘手的敵人，單人挑戰時大多不會想正面對戰。
  186層也可能很麻煩，但出現的敵人比較隨機。
  一般的策略是盡量少用魔陶器往前推進，
    再視情況使用魔陶器撐過最後幾層。
  「魔陶器：改變敵人」在這裡很好用－如果變出曼德拉草就太好了！
  就算變出模仿怪，也還是比大多數其他敵人好對付。
  「魔陶器：怒火」很好用，有幾種最佳的使用方式
  使用「魔陶器：運氣上升」清空整層（或盡量清光），再回頭收集戰利品。
  如果事先規劃好並搭配使用「魔陶器：寶箱增加」會更好。
  雙重怒火戰術－先盡量收集寶箱並找到出口位置，再使用「魔陶器：怒火」。
  盡快清掉出口附近的敵人，在「魔陶器：怒火」效果還在時進入傳送門。
  這樣就能在效果消失前，在下一層繼續擊殺幾隻敵人。
  「魔陶器：減少敵人」在這裡效果不佳，因為它跟「改變敵人」搭配不好，
    搭配「怒火」也省不了多少時間，因為這裡的敵人比較分散。
  如果需要的話，「魔陶器：減少敵人」在前面需要正面對戰的樓層能省下更多時間。
  這幾層要注意牆壁陷阱。
PotD191: |
  快到了！是時候不再保守，把手上的東西全部用上！
  依照手上持有的魔陶器擬定計畫再出發。
  只要有「魔陶器：復生」就立刻使用。
  可惜這個層數區間不會再掉落更多
  如果需要魔陶器，請提早使用「魔陶器：運氣上升」／「魔陶器：寶箱增加」
  大多數敵人用「魔陶器：覺悟」2~3擊就能擊殺
  通常最適合留到後面的樓層使用，
    但如果前面樓層有很多屍體型巡邏怪，也可以考慮提早使用，
    因為迴避牠們會很花時間
  請留意哪些敵人免疫暈眩，
    因為在對牠們補第二、三刀時大概會挨打。可以考慮使用「魔陶器：強化防禦」
  先使用「魔陶器：形態變化」會比較安全一些，但還是要小心小頑童型敵人
  前面樓層的敵人最好對付，因此「魔陶器：減少敵人」與「魔陶器：怒火」最好留到中後段樓層使用
  別忘了把手上的「魔陶器：咒印解除」與「魔陶器：全景」用完
  這幾層要注意牆壁陷阱。
